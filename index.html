<!DOCTYPE html>
<html>
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Anusharan Ventures - Smart Meeting and Follow-up Management">
<title>Anusharan Ventures</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F4F6F8; --panel:#FFFFFF; --ink:#0C2340; --inkSoft:#163A5F;
    --primary:#0A6E5C; --primarySoft:#E6F5F0; --primaryInk:#064E42;
    --accent:#D4A03C; --accentSoft:#FEF7E8;
    --overdue:#DC2626; --overdueSoft:#FEF2F2; --today:#D97706; --todaySoft:#FFFBEB;
    --done:#16A34A; --doneSoft:#F0FDF4; --meet:#2563EB; --meetSoft:#EFF6FF;
    --text:#1A2B3C; --muted:#64748B; --faint:#94A3B8; --line:#E2E8F0; --lineSoft:#F1F5F9;
    --radius:10px;
    --shadow:0 1px 3px rgba(0,0,0,0.06),0 1px 2px rgba(0,0,0,0.04);
    --shadow-md:0 4px 6px rgba(0,0,0,0.07),0 2px 4px rgba(0,0,0,0.04);
    --shadow-lg:0 10px 15px rgba(0,0,0,0.08),0 4px 6px rgba(0,0,0,0.04);
    --transition:all 0.2s ease;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
  a{color:inherit;text-decoration:none}
  .wrap{max-width:920px;margin:0 auto;padding:0 0 60px}

  /* ---- Header ---- */
  header{background:linear-gradient(135deg,var(--ink) 0%,#0F2D4F 100%);color:#fff;padding:0 20px;display:flex;align-items:center;gap:16px;position:sticky;top:0;z-index:5;height:56px;box-shadow:0 2px 12px rgba(12,35,64,0.18)}
  .brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:15px;letter-spacing:-0.01em;white-space:nowrap}
  .brandmark{background:linear-gradient(135deg,var(--primary),#0D8B73);width:32px;height:32px;border-radius:8px;display:grid;place-items:center;font-size:13px;font-weight:700;color:#fff;letter-spacing:-0.02em;box-shadow:0 2px 6px rgba(10,110,92,0.3)}
  .tabs{display:flex;gap:2px;margin-left:auto;flex-wrap:wrap}
  .tab{font-size:13px;padding:8px 14px;border-radius:8px;color:rgba(255,255,255,0.5);cursor:pointer;white-space:nowrap;transition:var(--transition);font-weight:500}
  .tab:hover{color:rgba(255,255,255,0.85);background:rgba(255,255,255,0.08)}
  .tab.active{color:#fff;background:rgba(255,255,255,0.13);box-shadow:inset 0 0 0 1px rgba(255,255,255,0.1)}
  .tab:focus-visible{outline:2px solid var(--accent);outline-offset:1px}

  /* ---- Content ---- */
  .main{padding:24px 20px}
  h1{font-size:24px;font-weight:700;margin:4px 0 4px;letter-spacing:-0.02em;line-height:1.25;color:var(--ink)}
  .eyebrow{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
  .sub{color:var(--muted);font-size:13px;margin:4px 0 0;line-height:1.6}

  /* ---- Statistics ---- */
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:18px 0}
  .stat{border-radius:var(--radius);padding:18px 16px;border:1px solid transparent;box-shadow:var(--shadow);transition:var(--transition)}
  .stat:hover{box-shadow:var(--shadow-md);transform:translateY(-1px)}
  .stat .n{font-size:30px;font-weight:700;line-height:1}
  .stat .l{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;margin-top:6px}

  /* ---- Sections ---- */
  .sec{margin:28px 0 0}
  .sech{display:flex;align-items:center;gap:8px;font-weight:600;font-size:14px;margin-bottom:12px;color:var(--ink)}
  .sech .c{font-weight:600;color:var(--muted);font-size:11px;background:var(--lineSoft);border-radius:999px;padding:2px 9px}

  /* ---- Task/Item Rows ---- */
  .row{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:12px 12px 12px 14px;display:flex;align-items:center;gap:10px;margin-bottom:8px;transition:var(--transition);box-shadow:var(--shadow)}
  .row:hover{box-shadow:var(--shadow-md);border-color:rgba(0,0,0,0.06)}
  .row .stripe{width:4px;align-self:stretch;border-radius:4px}
  .row .body{flex:1;min-width:0}
  .row .t{font-size:13px;font-weight:600;color:var(--text)}
  .row .meta{font-size:12px;color:var(--muted);margin-top:4px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}

  /* ---- Pills & Chips ---- */
  .pill{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;padding:3px 8px;border-radius:5px}
  .chip{font-size:11px;font-weight:600;padding:4px 10px;border-radius:999px;white-space:nowrap}

  /* ---- Action buttons ---- */
  .acts{display:flex;align-items:center;flex-shrink:0;gap:2px}
  .ib{width:32px;height:32px;border:none;background:none;border-radius:8px;color:var(--muted);cursor:pointer;font-size:15px;display:grid;place-items:center;transition:var(--transition)}
  .ib:hover{background:var(--lineSoft);color:var(--text)}
  .ib:focus-visible{outline:2px solid var(--primary);outline-offset:1px}
  .ib.danger{color:var(--overdue)} .ib.danger:hover{background:var(--overdueSoft)}
  .ib.accent{color:var(--meet)} .ib.accent:hover{background:var(--meetSoft)}

  /* ---- Checkbox ---- */
  .cbtn{width:22px;height:22px;border-radius:50%;border:2px solid var(--primary);background:none;cursor:pointer;flex-shrink:0;transition:var(--transition)}
  .cbtn:hover{background:var(--primarySoft);border-color:var(--primaryInk)}
  .cbtn.done{background:var(--done);border-color:var(--done);color:#fff}
  .cbtn:focus-visible{outline:2px solid var(--primary);outline-offset:2px}

  /* ---- Grid & Cards ---- */
  .grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);transition:var(--transition)}
  .card:hover{box-shadow:var(--shadow-md)}
  .cardh{display:flex;align-items:center;gap:8px;margin-bottom:10px;font-weight:600;font-size:14px}
  .mini{display:flex;align-items:center;gap:8px;margin:7px 0;font-size:12px}
  .dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
  .mini .mt{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  /* ---- Buttons ---- */
  .btn{border:none;border-radius:8px;padding:10px 16px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;transition:var(--transition);display:inline-flex;align-items:center;justify-content:center;gap:6px;line-height:1.3}
  .btn:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
  .btn.primary{background:linear-gradient(135deg,var(--primary),#0D8B73);color:#fff;box-shadow:0 1px 3px rgba(10,110,92,0.3)}
  .btn.primary:hover{background:linear-gradient(135deg,#08594A,#0A7A66);box-shadow:0 2px 6px rgba(10,110,92,0.35)}
  .btn.primary:active{transform:scale(0.98)}
  .btn.ghost{background:var(--panel);color:var(--text);border:1px solid var(--line)}
  .btn.ghost:hover{background:var(--lineSoft);border-color:#CBD5E1}
  .btn.block{width:100%}

  /* ---- Empty state ---- */
  .empty{border:2px dashed var(--line);border-radius:var(--radius);padding:18px;color:var(--muted);font-size:13px;background:var(--panel);text-align:center}

  /* ---- Note/Alert ---- */
  .note{border-radius:var(--radius);padding:14px 16px;font-size:13px;display:flex;gap:10px;line-height:1.5;align-items:flex-start}

  /* ---- FAB ---- */
  .fab{position:fixed;right:20px;bottom:20px;background:linear-gradient(135deg,var(--primary),#0D8B73);color:#fff;border:none;width:52px;height:52px;border-radius:50%;font-size:26px;cursor:pointer;box-shadow:0 4px 16px rgba(10,110,92,0.35);z-index:6;transition:var(--transition);line-height:1}
  .fab:hover{transform:scale(1.08);box-shadow:0 6px 22px rgba(10,110,92,0.4)}
  .fab:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
  .fab:active{transform:scale(0.95)}

  /* ---- Modal ---- */
  .overlay{position:fixed;inset:0;background:rgba(12,35,64,0.65);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);display:flex;align-items:flex-end;justify-content:center;z-index:20;padding:0}
  .modal{background:var(--panel);width:100%;max-width:540px;border-radius:16px 16px 0 0;max-height:92vh;overflow:auto}
  @media(min-width:600px){.overlay{align-items:center;padding:16px}.modal{border-radius:14px;box-shadow:var(--shadow-lg),0 0 0 1px rgba(0,0,0,0.05)}}
  .mhead{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--line);font-weight:700;font-size:15px;position:sticky;top:0;background:var(--panel);z-index:1}
  .mbody{padding:20px;display:flex;flex-direction:column;gap:16px}
  .mfoot{display:flex;gap:8px;align-items:center;padding:16px 20px;border-top:1px solid var(--line);position:sticky;bottom:0;background:var(--panel)}

  /* ---- Form elements ---- */
  label.f{display:block}
  label.f .lb{font-size:12px;font-weight:600;color:var(--inkSoft);margin-bottom:6px;display:block;letter-spacing:0.01em}
  input,select,textarea{width:100%;border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:13px;background:#fff;color:var(--text);font-family:inherit;transition:border-color 0.2s ease,box-shadow 0.2s ease;outline:none}
  input:not([type="checkbox"]):not([type="radio"]):not([type="file"]),select{height:40px}
  input:focus,select:focus,textarea:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(10,110,92,0.1)}
  input::placeholder,textarea::placeholder{color:var(--faint)}
  input[type="checkbox"],input[type="radio"]{width:auto;height:auto}
  textarea{resize:vertical;min-height:56px}
  select{cursor:pointer;appearance:auto}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .segs{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .seg{border:1px solid var(--line);background:#fff;border-radius:8px;padding:10px;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer;text-align:center;transition:var(--transition)}
  .seg:hover{border-color:var(--primary);color:var(--primaryInk);background:var(--primarySoft)}
  .prio{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}

  /* ---- Toast ---- */
  .toast{position:fixed;left:50%;bottom:78px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 20px;border-radius:10px;font-size:13px;font-weight:500;z-index:30;max-width:90%;box-shadow:0 8px 24px rgba(0,0,0,0.2);animation:toast-in 0.3s ease}
  @keyframes toast-in{from{opacity:0;transform:translateX(-50%) translateY(10px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}

  /* ---- Action rows ---- */
  .actrow{display:grid;grid-template-columns:2fr 1fr 1fr auto;gap:8px;align-items:center;margin-bottom:8px}

  /* ---- Loading ---- */
  .loading{padding:80px 16px;text-align:center;color:var(--muted);font-size:15px}

  /* ---- Toolbar ---- */
  .toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
  .toolbar select,.toolbar input{width:auto;flex:1;min-width:120px}

  /* ---- Avatar ---- */
  .avatar{width:40px;height:40px;border-radius:50%;background:var(--primarySoft);color:var(--primaryInk);display:grid;place-items:center;font-weight:700;font-size:15px;flex-shrink:0}

  /* ---- Recording Animation ---- */
  @keyframes pulse-rec{0%,100%{opacity:1}50%{opacity:0.3}}
  #recIndicator{animation:pulse-rec 1.2s ease-in-out infinite}

  /* ---- AI Panel Enhancements ---- */
  #btnSummarize{font-size:14px;padding:12px 16px}
  #mom_audio_player{border-radius:8px}

  /* ---- Scrollbar ---- */
  ::-webkit-scrollbar{width:6px;height:6px}
  ::-webkit-scrollbar-track{background:transparent}
  ::-webkit-scrollbar-thumb{background:var(--line);border-radius:3px}
  ::-webkit-scrollbar-thumb:hover{background:var(--muted)}

  /* ---- Selection ---- */
  ::selection{background:var(--primarySoft);color:var(--primaryInk)}

  /* ---- Responsive: Tablet ---- */
  @media(max-width:768px){
    header{padding:10px 14px;gap:8px;height:auto;min-height:48px;flex-wrap:wrap}
    .brand{font-size:14px}
    .brandmark{width:28px;height:28px;font-size:11px}
    .tabs{gap:2px;order:3;width:100%;justify-content:flex-start;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;padding:4px 0 2px}
    .tabs::-webkit-scrollbar{display:none}
    .tab{font-size:12px;padding:6px 10px}
    #userNav{font-size:10px}
    .main{padding:16px 14px}
    h1{font-size:20px}
    .stats{grid-template-columns:repeat(2,1fr)}
    .grid3{grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}
    .two{grid-template-columns:1fr}
    .actrow{grid-template-columns:1fr 1fr;gap:6px}
    .actrow>input:first-child{grid-column:1/-1}
    .row{flex-wrap:wrap}
    .row .acts:last-child{width:100%;justify-content:flex-end;margin-top:4px;border-top:1px solid var(--lineSoft);padding-top:6px}
  }

  /* ---- Responsive: Mobile ---- */
  @media(max-width:480px){
    .stats{grid-template-columns:1fr}
    .wrap{padding:0 0 80px}
    .main{padding:14px 10px}
    h1{font-size:18px}
    .stat{padding:14px 12px}
    .prio{grid-template-columns:repeat(2,1fr)}
    .modal{max-height:95vh}
    .mbody{padding:16px}
    .mfoot{padding:12px 16px}
    .grid3{grid-template-columns:1fr}
    .card{padding:14px}
    .fab{right:14px;bottom:14px;width:48px;height:48px;font-size:22px}
  }

</style>
<script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand"><span class="brandmark">AV</span> Anusharan Ventures</div>
    <div class="tabs" id="tabs"></div>
    <div id="userNav" style="display:flex;align-items:center;gap:8px;margin-left:auto"></div>
  </header>
  <div class="main" id="view"><div class="loading">Loading your workspaceGǪ</div></div>
</div>
<button class="fab" id="fab" title="New item">+</button>
<div id="modalRoot"></div>
<div id="toastRoot"></div>

<script>
/* ---------------- constants ---------------- */
var CATEGORIES=['Calendar & Schedule','Inbox & Correspondence','Meetings & Minutes','Travel & Logistics','Travel Insurance','Insurance & Policies','Telephone & Bills','Documents & Reports','Projects & Events','Expenses & Budget','Board & Stakeholders','Housekeeping','Fun Factor'];
var DEPARTMENTS=['HR','Accounts','Insurance','IT','Audit','Infrastructure'];
var PRIORITIES=[['urgent','Urgent','#D14343','#FBE9E9'],['high','High','#C0791A','#FAF0E1'],['medium','Medium','#0F766E','#E3F0EF'],['low','Low','#6A7681','#EEF1F3']];
var RECUR=[['none','One-off'],['daily','Daily'],['weekly','Weekly'],['monthly','Monthly'],['quarterly','Quarterly'],['yearly','Yearly']];
var PRESETS=[
  {title:'Reconcile telephone bills G�� all directors',category:'Telephone & Bills',recurring:'monthly',priority:'medium'},
  {title:'Submit corporate card receipts & expense report',category:'Expenses & Budget',recurring:'monthly',priority:'high'},
  {title:'Check travel insurance validity / renewals',category:'Travel Insurance',recurring:'monthly',priority:'high'},
  {title:'Distribute board book & confirm attendance',category:'Board & Stakeholders',recurring:'quarterly',priority:'high'}
];
var S={tasks:[],contacts:[],settings:{directors:[],deptEmails:{}}}, V='dashboard';

/* ---------------- server bridge ---------------- */
function srv(fn){var args=[].slice.call(arguments,1);return fetch('/api/backend',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:fn,params:args})}).then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.json();});}
window.srv=srv;

/* ---------------- date helpers ---------------- */
function pad(n){return (n<10?'0':'')+n;}
function toStr(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function todayStr(){return toStr(new Date());}
function fromStr(s){var p=s.split('-');return new Date(+p[0],+p[1]-1,+p[2]);}
function effDate(t){if(!t.dueDate)return null;var p=t.dueDate.split('-');var tm=(t.dueTime||'23:59').split(':');return new Date(+p[0],+p[1]-1,+p[2],+tm[0],+tm[1]);}
function dayDiff(s){return Math.round((fromStr(s)-fromStr(todayStr()))/86400000);}
function overdue(t){return t.status==='pending'&&effDate(t)&&effDate(t)<new Date()&&dayDiff(t.dueDate)<0;}
function dueToday(t){return t.status==='pending'&&t.dueDate===todayStr();}
function satOfWeek(){var d=new Date();return new Date(d.getFullYear(),d.getMonth(),d.getDate()+((6-d.getDay()+7)%7));}
function thisWeek(t){if(t.status!=='pending'||!t.dueDate)return false;var dd=dayDiff(t.dueDate);return dd>0&&fromStr(t.dueDate)<=satOfWeek();}
function niceDate(s){return fromStr(s).toLocaleDateString('en-IN',{weekday:'short',day:'numeric',month:'short'});}
function relLabel(t){if(!t.dueDate)return 'No date';var d=dayDiff(t.dueDate);if(t.status==='done')return 'Done';if(d<-1)return 'Overdue by '+(-d)+' days';if(d===-1)return 'Overdue by 1 day';if(d===0)return t.dueTime?('Today '+t.dueTime):'Due today';if(d===1)return 'Tomorrow';return 'In '+d+' days';}
function addDay(s){var d=fromStr(s);d.setDate(d.getDate()+1);return toStr(d);}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function emails(t){return String(t.attendees||'').split(/[,;\s]+/).map(function(s){return s.trim();}).filter(function(s){return s.indexOf('@')>-1;});}
function prio(k){for(var i=0;i<PRIORITIES.length;i++)if(PRIORITIES[i][0]===k)return PRIORITIES[i];return PRIORITIES[2];}
function contactById(id){for(var i=0;i<S.contacts.length;i++)if(S.contacts[i].id===id)return S.contacts[i];return null;}
function taskById(id){for(var i=0;i<S.tasks.length;i++)if(S.tasks[i].id===id)return S.tasks[i];return null;}

/* ---------------- boot & auth ---------------- */
window.onload=function(){checkAuth();};
document.getElementById('fab').onclick=function(){openTask(null,{});};

function checkAuth(){
  fetch('/api/auth')
    .then(function(r){return r.json();})
    .then(function(res){
      if(res.authenticated){
        document.getElementById('tabs').style.display='flex';
        document.getElementById('fab').style.display='block';
        renderUserNav(res.user);
        loadDesk();
      }else{
        renderLogin(res.clientId);
      }
    })
    .catch(function(e){
      document.getElementById('view').innerHTML='<div class="empty">Authentication check failed. Reload page.</div>';
    });
}

function renderLogin(clientId){
  document.getElementById('tabs').style.display='none';
  document.getElementById('fab').style.display='none';
  document.getElementById('userNav').innerHTML='';
  var h='<div class="card" style="max-width:440px;margin:60px auto;text-align:center;padding:32px 28px">'+
    '<div class="brandmark" style="margin:0 auto 16px;width:48px;height:48px;font-size:18px;border-radius:12px">AV</div>'+
    '<h2 style="margin:0 0 4px;font-size:22px;color:var(--ink)">Anusharan Ventures</h2>'+
    '<div class="eyebrow" style="margin-bottom:16px">Smart Meeting & Follow-up Management</div>'+
    '<p style="color:var(--muted);font-size:13px;margin-bottom:20px">Please sign in with your authorized Google account to access your workspace.</p>'+
    '<div id="g_id_onload" style="display:flex;justify-content:center;margin:16px 0"></div>'+
    '<div id="authErr" style="color:var(--overdue);margin-top:12px;font-size:12px;font-weight:600"></div>'+
    '</div>';
  document.getElementById('view').innerHTML=h;

  if(clientId && window.google && window.google.accounts){
    window.google.accounts.id.initialize({
      client_id: clientId,
      callback: handleCredentialResponse
    });
    window.google.accounts.id.renderButton(
      document.getElementById('g_id_onload'),
      { theme:'outline', size:'large', type:'standard' }
    );
  }else if(!clientId){
    document.getElementById('authErr').innerText='GOOGLE_CLIENT_ID environment variable is missing on server.';
  }
}

function handleCredentialResponse(response){
  toast('Signing in...');
  fetch('/api/auth',{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({credential:response.credential})
  })
  .then(function(r){return r.json();})
  .then(function(res){
    if(res.ok){
      document.getElementById('tabs').style.display='flex';
      document.getElementById('fab').style.display='block';
      renderUserNav(res.user);
      loadDesk();
    }else{
      document.getElementById('authErr').innerText=res.error||'Access denied';
      toast(res.error||'Sign in failed');
    }
  })
  .catch(function(err){
    toast('Network error during sign in');
  });
}

function renderUserNav(user){
  var nav=document.getElementById('userNav');
  if(user && user.email){
    nav.innerHTML='<span style="font-size:11px;color:#9AA6B0">'+esc(user.email)+'</span>'+
      '<button class="btn ghost" style="padding:4px 8px;font-size:11px;margin-left:4px" onclick="logout()">Logout</button>';
  }else{
    nav.innerHTML='';
  }
}

function logout(){
  fetch('/api/auth',{method:'DELETE'})
    .then(function(){window.location.reload();});
}

function loadDesk(){
  srv('getState').then(function(st){
    if(!st){
      document.getElementById('view').innerHTML='<div class="empty">Server returned no data.</div>';
      return;
    }
    S=st;
    render();
  }).catch(function(e){

function refreshTasks(p){return p.then(function(tasks){S.tasks=tasks;render();});}
function handle(act,id,el){

/* ---------------- AI MOM Live Recording & Summarization Logic ---------------- */

window.__mediaRecorder = null;
window.__audioChunks = [];
window.__recTimer = null;
window.__recSeconds = 0;
var MAX_REC_SECONDS = 600; // 10 minutes limit
var MAX_AUDIO_BYTES = 20 * 1024 * 1024; // 20 MB limit

function getSupportedMimeType() {
    var types = [
        'audio/webm;codecs=opus',
        'audio/webm',
        'audio/ogg;codecs=opus',
        'audio/mp4',
        'audio/aac'
    ];
    if (typeof MediaRecorder !== 'undefined' && MediaRecorder.isTypeSupported) {
        for (var i = 0; i < types.length; i++) {
            if (MediaRecorder.isTypeSupported(types[i])) return types[i];
        }
    }
    return 'audio/webm';
}

function fmtTimer(sec) {
    var m = Math.floor(sec / 60);
    var s = sec % 60;
    return (m < 10 ? '0' : '') + m + ':' + (s < 10 ? '0' : '') + s;
}

window.__startRecording = function() {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia || typeof MediaRecorder === 'undefined') {
        toast("Your browser does not support native microphone recording. Please use the file upload option below.");
        return;
    }
    navigator.mediaDevices.getUserMedia({ audio: true })
    .then(function(stream) {
        var mimeType = getSupportedMimeType();
        try {
            window.__mediaRecorder = new MediaRecorder(stream, { mimeType: mimeType });
        } catch (e) {
            window.__mediaRecorder = new MediaRecorder(stream);
            mimeType = window.__mediaRecorder.mimeType || 'audio/webm';
        }
        
        window.__audioChunks = [];
        window.__recSeconds = 0;

        window.__mediaRecorder.addEventListener("dataavailable", function(event) {
            if (event.data && event.data.size > 0) {
                window.__audioChunks.push(event.data);
            }
        });

        window.__mediaRecorder.addEventListener("stop", function() {
            if (window.__recTimer) {
                clearInterval(window.__recTimer);
                window.__recTimer = null;
            }
            toast("Finalizing audio file...");
            var audioBlob = new Blob(window.__audioChunks, { type: mimeType });

            if (audioBlob.size > MAX_AUDIO_BYTES) {
                toast("Audio file too large (" + Math.round(audioBlob.size / 1048576) + "MB). Limit is 20MB.");
                resetRecUI();
                return;
            }

            var reader = new FileReader();
            reader.onloadend = function() {
                var base64 = reader.result.split(',')[1];
                var ext = mimeType.indexOf('mp4') > -1 ? '.mp4' : mimeType.indexOf('ogg') > -1 ? '.ogg' : mimeType.indexOf('aac') > -1 ? '.aac' : '.webm';
                toast("Uploading securely to Drive...");
                srv('uploadAudioToDrive', 'MOM_Audio_' + Date.now() + ext, mimeType, base64)
                .then(function(res) {
                    if (res && res.ok) {
                        if (document.getElementById('mom_audio_url_hidden')) document.getElementById('mom_audio_url_hidden').value = res.url;
                        if (document.getElementById('mom_audio_id_hidden')) document.getElementById('mom_audio_id_hidden').value = res.id;
                        var player = document.getElementById('mom_audio_player');
                        if (player) {
                            player.src = res.url || URL.createObjectURL(audioBlob);
                            player.style.display = 'block';
                        }
                        toast("Audio saved!");
                    } else {
                        toast("Upload failed: " + (res && res.msg ? res.msg : "Unknown error") + ". You can use file upload below.");
                    }
                }).catch(function(e) {
                    toast("Upload error. You can use the file upload option below.");
                });
            };
            reader.readAsDataURL(audioBlob);
            resetRecUI();
        });

        window.__mediaRecorder.start(1000);

        // Recording timer
        var recInd = document.getElementById('recIndicator');
        if (recInd) {
            recInd.innerText = "🔴 Recording (00:00)...";
            recInd.style.display = 'inline-block';
        }
        window.__recTimer = setInterval(function() {
            window.__recSeconds++;
            if (recInd) {
                recInd.innerText = "🔴 Recording (" + fmtTimer(window.__recSeconds) + ")...";
            }
            if (window.__recSeconds >= MAX_REC_SECONDS) {
                toast("Maximum recording duration (10 min) reached.");
                window.__stopRecording();
            }
        }, 1000);

        var bStart = document.getElementById('btnStartRec');
        var bStop = document.getElementById('btnStopRec');
        if (bStart) bStart.style.display = 'none';
        if (bStop) bStop.style.display = 'inline-block';
        toast("Recording started...");
    })
    .catch(function(err) {
        console.error("Mic error:", err);
        var msg = "Could not access microphone.";
        if (err.name === 'NotAllowedError' || err.name === 'PermissionDeniedError') {
            msg = "Microphone access denied. Please allow microphone permissions in your browser.";
        } else if (err.name === 'NotFoundError' || err.name === 'DevicesNotFoundError') {
            msg = "No microphone found on your device.";
        } else if (err.name === 'NotReadableError' || err.name === 'TrackStartError') {
            msg = "Microphone is already in use by another application.";
        }
        toast(msg);
        alert(msg + " You can use the 'Or upload an audio file' option below instead.");
    });
};

window.__stopRecording = function() {
    if (window.__recTimer) {
        clearInterval(window.__recTimer);
        window.__recTimer = null;
    }
    if (window.__mediaRecorder && window.__mediaRecorder.state !== 'inactive') {
        window.__mediaRecorder.stop();
        if (window.__mediaRecorder.stream) {
            window.__mediaRecorder.stream.getTracks().forEach(function(track) { track.stop(); });
        }
    } else {
        resetRecUI();
    }
};

function resetRecUI() {
    var bStart = document.getElementById('btnStartRec');
    var bStop = document.getElementById('btnStopRec');
    var recInd = document.getElementById('recIndicator');
    if (bStart) bStart.style.display = 'inline-block';
    if (bStop) bStop.style.display = 'none';
    if (recInd) { recInd.style.display = 'none'; recInd.innerText = '🔴 Recording...'; }
}

window.__handleManualUpload = function(input) {
  if (input.files && input.files[0]) {
    var file = input.files[0];
    if (file.size > MAX_AUDIO_BYTES) {
      toast("Selected file is too large (" + Math.round(file.size / 1048576) + "MB). Limit is 20MB.");
      input.value = '';
      return;
    }
    var player = document.getElementById('mom_audio_player');
    if (player) {
      player.src = URL.createObjectURL(file);
      player.style.display = 'block';
    }

    toast("Uploading audio to Google Drive...");
    var reader = new FileReader();
    reader.onload = function(e) {
      var base64 = e.target.result.split(',')[1];
      srv('uploadAudioToDrive', file.name, file.type || 'audio/mp3', base64).then(function(res) {
        if (res && res.ok) {
          if (document.getElementById('mom_audio_url_hidden')) document.getElementById('mom_audio_url_hidden').value = res.url;
          if (document.getElementById('mom_audio_id_hidden')) document.getElementById('mom_audio_id_hidden').value = res.id;
          toast("Manual upload saved securely.");
        } else { toast("Upload failed: " + (res && res.msg ? res.msg : "Unknown error")); }
      }).catch(function(err) {
        toast("Upload error. Check network connection.");
      });
    };
    reader.readAsDataURL(file);
  }
};

window.__processWithGemini = function() {
  var fileId = document.getElementById('mom_audio_id_hidden').value;
  var text = document.getElementById('mom_transcript').value;
  var fileInput = document.getElementById('mom_audio_file');
  var btn = document.getElementById('btnSummarize');

  if (!fileId && (!fileInput.files || fileInput.files.length === 0) && !text.trim()) {
     toast("Please record, upload, or paste text first.");
     return;
  }

  btn.innerText = "Processing with Gemini...";
  btn.disabled = true;

  function doSummarize(id, txt) {
    fetch('/api/summarize', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ fileId: id, text: txt })
    })
    .then(function(r) { return r.json(); })
    .then(function(res) {
      btn.innerText = "G Process & Summarize";
      btn.disabled = false;
      if (res.error) {
        toast(res.error);
        return;
      }
      try {
        var parsed = res.data;
        document.getElementById('mom_transcript').value = parsed.transcript || text;
        document.getElementById('mom_disc').value = (parsed.summary ? parsed.summary + '\n\n' : '') + (parsed.discussion || "");
        document.getElementById('mom_dec').value = parsed.decisions || "";
        
        // Parse and populate structured action items
        if (parsed.actions && Array.isArray(parsed.actions)) {
          window.__momActs = parsed.actions.map(function(a) {
            return {
              what: a.what || "",
              owner: a.owner || "",
              due: a.due || ""
            };
          });
          if (!window.__momActs.length) {
            window.__momActs = [{ what: '', owner: '', due: '' }];
          }
          renderActs();
        }
        
        toast("Processing complete! Review your MOM below.");
      } catch (e) {
        toast("Error parsing summary response.");
        console.error("Parse error:", e);
      }
    })
    .catch(function(err) {
      btn.innerText = "G Process & Summarize";
      btn.disabled = false;
      toast("Network error during AI summarization.");
      console.error(err);
    });
  }

  // If a file is selected but not yet uploaded/saved to hidden inputs
  if (!fileId && fileInput.files && fileInput.files.length > 0) {
    toast("Uploading selected file before processing...");
    var file = fileInput.files[0];
    var reader = new FileReader();
    reader.onload = function(e) {
      var base64 = e.target.result.split(',')[1];
      srv('uploadAudioToDrive', file.name, file.type || 'audio/mp3', base64)
      .then(function(res) {
        if (res && res.ok) {
          if (document.getElementById('mom_audio_url_hidden')) document.getElementById('mom_audio_url_hidden').value = res.url;
          if (document.getElementById('mom_audio_id_hidden')) document.getElementById('mom_audio_id_hidden').value = res.id;
          var player = document.getElementById('mom_audio_player');
          if (player) {
            player.src = res.url;
            player.style.display = 'block';
          }
          doSummarize(res.id, text);
        } else {
          toast("Upload failed. Processing text notes only.");
          doSummarize('', text);
        }
      })
      .catch(function() {
        toast("Upload failed. Processing text notes only.");
        doSummarize('', text);
      });
    };
    reader.readAsDataURL(file);
  } else {
    doSummarize(fileId, text);
  }
};

      '<textarea id="mom_transcript" rows="3" placeholder="Raw transcript or manual notes..." style="font-size:12px; margin-bottom:12px;">'+esc(t.momTranscript||'')+'</textarea>'+
      '<button class="btn primary block" id="btnSummarize" onclick="__processWithGemini()">G�� Process & Summarize</button>'+
    '</div>' : '';

  var m='<div class="overlay" onclick="closeModal(event)"><div class="modal" onclick="event.stopPropagation()">'+
   '<div class="mhead">Minutes of Meeting<button class="ib" onclick="closeModal()">G��</button></div><div class="mbody">'+
   '<div style="font-size:13px;color:var(--muted)">'+esc(t.title)+(t.dueDate?' -+ '+niceDate(t.dueDate):'')+'</div>'+
   fld('Present','<input id="mom_present" value="'+esc(present)+'">')+
   aiPanel +
   fld('Discussion','<textarea id="mom_disc" rows="3">'+esc(t.momDiscussion)+'</textarea>')+
   fld('Decisions','<textarea id="mom_dec" rows="2">'+esc(t.momDecisions)+'</textarea>')+
   '<div><div class="lb" style="font-size:12px;font-weight:600;color:var(--inkSoft);margin-bottom:6px">Action items</div><div id="momacts"></div><button class="btn ghost" style="padding:6px 10px;font-size:12px" onclick="__addAct()">+ Add action</button></div>'+
   '</div><div class="mfoot"><button class="btn ghost" onclick="__copyMom()">Copy</button><div style="margin-left:auto;display:flex;gap:8px"><button class="btn ghost" onclick="__saveMom()">Save</button><button class="btn primary" onclick="__circulate()">Circulate to members</button></div></div></div></div>';
  document.getElementById('modalRoot').innerHTML=m;renderActs();
}
function renderActs(){
  document.getElementById('momacts').innerHTML=window.__momActs.map(function(a,i){
    return '<div class="actrow"><input placeholder="Action" value="'+esc(a.what)+'" oninput="__act('+i+',\'what\',this.value)"><input placeholder="Owner" value="'+esc(a.owner)+'" oninput="__act('+i+',\'owner\',this.value)"><input type="date" value="'+esc(a.due)+'" oninput="__act('+i+',\'due\',this.value)"><button class="ib danger" onclick="__delAct('+i+')">=���</button></div>';
  }).join('');
}
window.__act=function(i,k,v){window.__momActs[i][k]=v;};
window.__addAct=function(){window.__momActs.push({what:'',owner:'',due:''});renderActs();};
window.__delAct=function(i){window.__momActs.splice(i,1);if(!window.__momActs.length)window.__momActs=[{what:'',owner:'',due:''}];renderActs();};
function collectMom(){return {present:document.getElementById('mom_present').value,discussion:document.getElementById('mom_disc').value,decisions:document.getElementById('mom_dec').value,actions:window.__momActs.filter(function(a){return a.what&&a.what.trim();}),
  transcript: document.getElementById('mom_transcript') ? document.getElementById('mom_transcript').value : '',
  audioUrl: document.getElementById('mom_audio_url_hidden') ? document.getElementById('mom_audio_url_hidden').value : '',
  audioId: document.getElementById('mom_audio_id_hidden') ? document.getElementById('mom_audio_id_hidden').value : ''
};}
window.__saveMom=function(){closeModal();toast('Saving MOMGǪ');refreshTasks(srv('saveMom',window.__momId,collectMom()));};
window.__circulate=function(){var id=window.__momId;toast('Saving and circulatingGǪ');srv('saveMom',id,collectMom()).then(function(tasks){S.tasks=tasks;srv('circulateMom',id).then(function(r){toast(r.msg);render();});});closeModal();};
window.__copyMom=function(){var t=Object.assign({},taskById(window.__momId));var m=collectMom();t.momPresent=m.present;t.momDiscussion=m.discussion;t.momDecisions=m.decisions;t.momActions=JSON.stringify(m.actions);var txt=buildMomText(t);navigator.clipboard&&navigator.clipboard.writeText(txt);toast('MOM text copied.');};
function buildMomText(t){var acts=[];try{acts=JSON.parse(t.momActions||'[]');}catch(e){}var l=['MINUTES OF MEETING','','Meeting: '+t.title,t.department?'Department: '+t.department:'',t.dueDate?'Date: '+niceDate(t.dueDate):'','Present: '+(t.momPresent||'G��'),'','DISCUSSION',t.momDiscussion||'G��','','DECISIONS',t.momDecisions||'G��','','ACTION ITEMS'];acts.length?acts.forEach(function(a,i){l.push((i+1)+'. '+a.what+(a.owner?' G�� '+a.owner:'')+(a.due?' G�� '+a.due:''));}):l.push('G��');return l.filter(function(x){return x!=='';}).join('\n');}
